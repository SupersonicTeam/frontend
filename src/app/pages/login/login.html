<div class="min-h-screen flex items-center justify-center p-4 bg-background">
  <div class="w-full max-w-xl space-y-6">

    <!-- Marca -->
    <div class="flex flex-col items-center text-center gap-2">
      <div class="flex items-center gap-2">
          <img
            src="/logo_preta.png"
            width="605"
            height="412"
            alt="AgroContábil"
            class="block h-14 w-auto sm:h-16 md:h-[4.75rem] max-w-[min(76vw,26rem)] object-contain"
          />
      </div>
      <p class="text-muted-foreground text-sm">
        Conformidade na reforma tributária 2026 (IBS/CBS) para o produtor rural e o contador.
      </p>
    </div>

    <div class="bg-card rounded-2xl shadow-sm border border-border p-6 space-y-5">
      <!-- Nome (cosmético, opcional) -->
      <div>
        <label for="login-nome" class="block text-sm font-medium text-foreground mb-1.5">Seu nome (opcional)</label>
        <input
          id="login-nome"
          type="text"
          placeholder="Ex: João da Silva"
          class="w-full px-3 py-2.5 rounded-xl border border-border bg-background text-sm focus:outline-none focus:ring-2 focus:ring-primary/30"
          [value]="nome()" (input)="nome.set($any($event.target).value)" />
      </div>

      <p class="text-sm font-medium text-foreground">Entrar como:</p>

      <div class="grid gap-3 sm:grid-cols-2">
        <!-- Produtor -->
        <button
          type="button"
          class="group flex flex-col items-start gap-2 rounded-2xl border border-border bg-background p-4 text-left hover:border-primary hover:ring-2 hover:ring-primary/20 transition-all"
          (click)="entrar('produtor')">
          <span class="flex items-center justify-center w-11 h-11 rounded-full bg-primary/10 text-primary">
            <svg lucideUser [size]="22" />
          </span>
          <span class="font-heading font-semibold text-foreground">Produtor rural</span>
          <span class="text-xs text-muted-foreground">Emissão de NF-e, documentos, calendário fiscal e assistente.</span>
          <span class="mt-1 inline-flex items-center gap-1 text-sm font-medium text-primary">
            Entrar <svg lucideArrowRight [size]="15" class="group-hover:translate-x-0.5 transition-transform" />
          </span>
        </button>

        <!-- Contador -->
        <button
          type="button"
          class="group flex flex-col items-start gap-2 rounded-2xl border border-border bg-background p-4 text-left hover:border-primary hover:ring-2 hover:ring-primary/20 transition-all"
          (click)="entrar('contador')">
          <span class="flex items-center justify-center w-11 h-11 rounded-full bg-accent/15 text-accent">
            <svg lucideCalculator [size]="22" />
          </span>
          <span class="font-heading font-semibold text-foreground">Contador</span>
          <span class="text-xs text-muted-foreground">Pendências, documentos e acompanhamento dos produtores.</span>
          <span class="mt-1 inline-flex items-center gap-1 text-sm font-medium text-primary">
            Entrar <svg lucideArrowRight [size]="15" class="group-hover:translate-x-0.5 transition-transform" />
          </span>
        </button>
      </div>

      <p class="text-[11px] text-center text-muted-foreground">
        Acesso demonstrativo — sem senha. Serve apenas para separar os perfis na apresentação.
      </p>
    </div>
  </div>
</div>
