<!-- Um bloco por origem. A tabela oficial do IBS/CBS é igual para todos: não é dado do
     produtor, e dizer "calculado a partir das suas notas" sobre ela seria falso (#132). -->
@for (grupo of grupos(); track grupo.origem) {
  <section
    class="mt-3 rounded-controle border border-border bg-surface-2 p-3"
    [attr.aria-label]="grupo.rotulo"
    [attr.data-fontes]="grupo.origem"
  >
    <p class="flex items-center gap-1.5 text-apoio font-semibold text-foreground">
      @if (grupo.origem === 'oficial') {
        <svg lucideLandmark [size]="14" aria-hidden="true" />
      } @else {
        <svg lucideDatabase [size]="14" aria-hidden="true" />
      }
      {{ grupo.titulo }}
    </p>

    <ul class="mt-1.5 flex flex-col gap-1">
      @for (fonte of grupo.fontes; track fonte.funcao + $index) {
        <li class="text-apoio leading-relaxed text-muted-foreground">
          <span class="font-medium text-foreground">{{ rotulo(fonte.funcao) }}</span>
          @if (detalhe(fonte)) {
            <span> — {{ detalhe(fonte) }}</span>
          }
        </li>
      }
    </ul>
  </section>
}
