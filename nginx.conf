server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy para a API — mesma origem do frontend, elimina CORS no navegador.
    # O host "backend" resolve pelo DNS interno do Docker Compose (nome do servico).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA do Angular: qualquer rota nao encontrada cai no index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O index.html nunca vem do cache sem perguntar ao servidor (#162). E ele que diz quais
    # arquivos com hash existem: um index.html velho apontaria para chunks que o deploy apagou.
    # As rotas da SPA tambem chegam aqui, pelo try_files acima (redirecionamento interno).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:css|js|map|ico|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        access_log off;
    }
}
