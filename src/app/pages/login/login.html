<div class="min-h-screen flex items-center justify-center p-4 bg-background">
  <div class="w-full max-w-md space-y-6">
    <!-- Marca -->
    <div class="flex flex-col items-center text-center gap-2">
      <img
        src="/agroconia-horizontal.svg"
        width="1617"
        height="400"
        alt="AgroConIA"
        class="block h-14 w-auto max-w-[min(76vw,26rem)] object-contain sm:h-16 md:h-[4.75rem] dark:hidden"
      />
      <img
        src="/agroconia-horizontal-negativo.svg"
        width="1617"
        height="400"
        alt=""
        aria-hidden="true"
        class="hidden h-14 w-auto max-w-[min(76vw,26rem)] object-contain sm:h-16 md:h-[4.75rem] dark:block"
      />
      <p class="text-apoio text-muted-foreground">
        Conformidade na reforma tributária 2026 (IBS/CBS) para o produtor rural e o contador.
      </p>
    </div>

    <form
      class="bg-card rounded-card shadow-suave border border-border p-6 space-y-5"
      (ngSubmit)="entrar()"
      novalidate
    >
      <h1 class="font-heading text-xl font-semibold text-foreground">Entrar</h1>

      <!--
        O erro fica num `role="alert"` acima dos campos: leitor de tela anuncia sem o usuário
        precisar procurar, e quem usa o teclado não perde o aviso ao voltar para o campo.
      -->
      @if (erro()) {
        <p
          role="alert"
          class="rounded-controle border border-perigo-borda bg-perigo-soft px-3 py-2 text-apoio text-perigo-ink"
        >
          {{ erro() }}
        </p>
      }

      <div>
        <label for="login-email" class="mb-1.5 block text-apoio font-medium text-foreground">
          E-mail
        </label>
        <input
          id="login-email"
          name="email"
          type="email"
          autocomplete="username"
          inputmode="email"
          required
          placeholder="voce@exemplo.com.br"
          class="tap-target w-full rounded-controle border border-border bg-background px-3 text-valor focus:outline-none focus:ring-2 focus:ring-primary/30"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
        />
      </div>

      <div>
        <label for="login-senha" class="mb-1.5 block text-apoio font-medium text-foreground">
          Senha
        </label>
        <input
          id="login-senha"
          name="senha"
          type="password"
          autocomplete="current-password"
          required
          class="tap-target w-full rounded-controle border border-border bg-background px-3 text-valor focus:outline-none focus:ring-2 focus:ring-primary/30"
          [value]="senha()"
          (input)="senha.set($any($event.target).value)"
        />
      </div>

      <button
        type="submit"
        class="tap-target inline-flex w-full items-center justify-center gap-2 rounded-controle bg-primary px-4 text-apoio font-medium text-primary-foreground transition-colors hover:bg-primary/90 disabled:cursor-not-allowed disabled:opacity-60"
        [disabled]="!podeEnviar()"
      >
        @if (enviando()) {
          <svg lucideLoaderCircle [size]="18" class="animate-spin" aria-hidden="true"></svg>
          Entrando…
        } @else {
          <svg lucideLogIn [size]="18" aria-hidden="true"></svg>
          Entrar
        }
      </button>

      <div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-2 text-apoio">
        <a routerLink="/esqueci-senha" class="font-medium text-primary hover:underline">
          Esqueci minha senha
        </a>
        <span class="text-muted-foreground">
          Não tem conta?
          <a routerLink="/cadastro" class="font-medium text-primary hover:underline">Criar conta</a>
        </span>
      </div>

      <p class="text-apoio text-center text-muted-foreground">
        Produtor rural ou contador: o acesso é o mesmo. Suas telas vêm da conta.
      </p>
    </form>
  </div>
</div>
